<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCO</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/ryder_cup_logo_180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/ryder_cup_logo_192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/ryder_cup_logo_512.png">
</head>
<body>
  <canvas id="flutter-canvas"></canvas>
  <script src="main.dart.js" type="application/javascript"></script>
  <script>
    window.addEventListener('load', function () {
      let dpi = window.devicePixelRatio;
      let width = screen.availWidth * dpi;
      let height = screen.availHeight * dpi;
      let canvas = document.getElementById('flutter-canvas');
      if (canvas) {
        canvas.width = width;
        canvas.height = height;
      } else {
        console.error('Canvas element not found');
      }
    });
  </script>
</body>
</html>
